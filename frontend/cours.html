<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cours</title>
<meta name="theme-color" content="#0d7a5f">
<script>try { if (localStorage.getItem("aida_theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}</script>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/cours.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
</head>
<body>
<div class="lesson-app">

  <header class="lesson-top">
    <button class="lesson-back" title="Retour" aria-label="Retour" onclick="history.back()">←</button>
    <div class="lesson-title">
      <span class="eyebrow" id="lesson-eyebrow">Chargement…</span>
      <span class="name" id="lesson-name"></span>
    </div>
  </header>

  <div class="lesson-progress" id="progress" aria-label="Progression dans la leçon"></div>

  <main class="lesson-body" id="lesson-body">
    <section class="slide active" data-slide="0">
      <p class="muted">Chargement de la leçon…</p>
    </section>
  </main>

  <nav class="lesson-nav">
    <button class="nav-btn prev" id="btn-prev">← Précédent</button>
    <button class="nav-btn next" id="btn-next">Suivant →</button>
  </nav>

</div>

<script src="js/config.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script src="js/diagram-viewer.js"></script>
<script src="js/speech-text.js"></script>
<script src="js/voice-server.js"></script>
<script src="js/cours-progress.js"></script>
<script src="js/cours-engine.js"></script>
<script src="js/cours-render.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const slug = params.get("slug");
  const fallbackFor = params.get("fallback_for");
  const body = document.getElementById("lesson-body");

  if (!slug) {
    body.innerHTML = '<p class="muted">Aucun cours demandé.</p>';
    return;
  }

  const base = window.AIDA_API_BASE_URL || "";
  const MATH_DELIMITERS = [
    { left: "$$", right: "$$", display: true },
    { left: "\\[", right: "\\]", display: true },
    { left: "$", right: "$", display: false },
    { left: "\\(", right: "\\)", display: false },
  ];
  fetch(`${base}/api/cours/${encodeURIComponent(slug)}`)
    .then(r => {
      if (!r.ok) throw new Error("introuvable");
      return r.json();
    })
    .then(lesson => {
      if (fallbackFor) lesson.fallback_for = fallbackFor;
      const view = renderLesson(lesson, { eyebrow: "lesson-eyebrow", name: "lesson-name", body: "lesson-body" });
      if (window.renderMathInElement) {
        renderMathInElement(body, { delimiters: MATH_DELIMITERS, throwOnError: false });
      }
      // Liste du programme (meme pays/niveau/matiere) pour proposer le
      // chapitre suivant en fin de lecon - facultatif, sans effet si hors-ligne.
      const listParams = new URLSearchParams({
        pays: fallbackFor || lesson.pays, niveau: lesson.niveau, matiere: lesson.matiere,
      });
      fetch(`${base}/api/cours?${listParams.toString()}`)
        .then(r => (r.ok ? r.json() : []))
        .then(list => { if (view && view.setSiblings) view.setSiblings(list); })
        .catch(() => {});
    })
    .catch(() => {
      document.getElementById("lesson-eyebrow").textContent = "Erreur";
      body.innerHTML = '<p class="muted">Ce cours est introuvable ou pas encore disponible. Vérifie ta connexion internet puis réessaie.</p>';
    });

})();
</script>
</body>
</html>
